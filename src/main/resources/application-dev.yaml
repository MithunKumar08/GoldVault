spring:
  application:
    name: GoldVault

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/golddb
    username: root
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

cors:
  url: http://goldvault-frontend.s3-website-us-east-1.localhost:4566/

